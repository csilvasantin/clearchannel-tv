<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla de sala</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #f4f0ff; font: 18px/1.3 "Avenir Next", sans-serif; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .hud { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; gap: 12px; }
    .pill { background: rgba(0,0,0,.72); border: 1px solid rgba(125,255,208,.7); border-radius: 12px; padding: 10px 12px; }
    #espera { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #000; }
    #espera[hidden] { display: none; }
    #espera strong { color: #7dffd0; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div id="espera"><div><strong>PANTALLA DE SALA</strong><p id="espera-txt">En espera de Publicar</p></div></div>
  <video id="video" playsinline autoplay muted></video>
  <div class="hud">
    <div class="pill" id="titulo">—</div>
    <div class="pill" id="fase">en espera</div>
  </div>
  <script src="sala.js"></script>
</body>
</html>
