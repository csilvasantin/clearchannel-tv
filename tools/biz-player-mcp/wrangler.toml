name = "admira-biz-player-docs"
main = "worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = false
preview_urls = false
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
[[services]]
binding = "GATE"
service = "yokup-site-gate"
[vars]
RELEASE = "v.12.10.2026.r2.16:02"

[[routes]]
pattern = "admira.biz/mcp/"
zone_name = "admira.biz"

[[routes]]
pattern = "admira.biz/mcp/index.html"
zone_name = "admira.biz"

[[routes]]
pattern = "admira.biz/mcp/manifest.json"
zone_name = "admira.biz"

[[routes]]
pattern = "admira.biz/mcp/llms.txt"
zone_name = "admira.biz"

[[routes]]
pattern = "admira.biz/mcp/native-players.md"
zone_name = "admira.biz"

[[routes]]
pattern = "admira.biz/mcp/player-sync-evidence/*"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/index.html"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/manifest.json"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/llms.txt"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/native-players.md"
zone_name = "admira.biz"

[[routes]]
pattern = "www.admira.biz/mcp/player-sync-evidence/*"
zone_name = "admira.biz"
