name: Publicar admira.biz

# Cada merge en main publica admira.biz con deploy-biz.sh (Carlos, 14-oct-2026): antes solo se podía
# publicar desde el Mac Mini y los cambios mergeados esperaban a que alguien se acordara.
# Firma: el agente que hizo el cambio (autor del último commit del PR) · GitHubActions.
# Ver docs/publicacion-biz.md.
# No se publica en rojo (Morfeo, 17-oct-2026): los tests corren en cada PR y antes de cada publicación,
# y tras publicar se revisa la consola de producción.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # El test del release hace git archive de la revisión preservada de clearchannel.tv.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm test es la forma canónica: el package.json de la raíz hace que dé lo mismo en cualquier carpeta.
      - name: Tests
        run: npm test

  publicar:
    needs: tests
    if: github.repository == 'csilvasantin/clearchannel-tv' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Una publicación detrás de otra; si llegan varios merges seguidos, la pendiente se queda con el último.
    concurrency:
      group: publicar-admira-biz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # build-biz-release.mjs saca de git la revisión preservada de clearchannel.tv.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Responsable del release
        run: |
          set -euo pipefail
          # En un merge, el autor del PR es el del segundo padre; en un push directo, el del commit.
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then agente="$(git log -1 --format=%an 'HEAD^2')"; else agente="$(git log -1 --format=%an HEAD)"; fi
          agente="$(printf '%s' "$agente" | tr -cd '[:alnum:] ._-' | cut -c1-60)"
          echo "ADMIRA_RELEASE_AGENT=${agente:-GitHubActions}" >> "$GITHUB_ENV"
          echo "ADMIRA_RELEASE_MACHINE=GitHubActions" >> "$GITHUB_ENV"

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "✗ falta el secreto CLOUDFLARE_API_TOKEN en el repo"; exit 1; }
          # Un token mal pegado (espacios, salto de línea o la línea de al lado) rompe la cabecera Authorization
          # de wrangler. Nos quedamos solo con lo que tiene forma de token de Cloudflare (14-oct-2026).
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1 || true)"
          test -n "$token" || { echo "✗ CLOUDFLARE_API_TOKEN no tiene forma de token de Cloudflare: vuelve a guardarlo"; exit 1; }
          echo "::add-mask::$token"
          CLOUDFLARE_API_TOKEN="$token" ./deploy-biz.sh

      - name: Comprobar producción
        run: |
          set -euo pipefail
          esperado="$(git rev-parse --short=7 HEAD)"
          for intento in 1 2 3 4 5 6; do
            vivo="$(curl -fsS "https://admira.biz/version.json?t=$(date +%s)" | jq -r '.gitShort // empty')"
            if [ "$vivo" = "$esperado" ]; then echo "✓ admira.biz sirve $esperado"; exit 0; fi
            sleep 10
          done
          # Si otro merge salió después, producción ya va por delante: no es un fallo.
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "· producción ya publica un commit posterior"; exit 0; fi
          echo "✗ admira.biz no sirve $esperado (sirve «$vivo»)"; exit 1

      # Portada, backoffice, Bugito y plano en un Chrome sin ventana: si hay errores de consola, el flujo
      # sale en rojo y avisa. Ya está publicado: se arregla con otro merge o se vuelve a la versión anterior.
      - name: Revisar consola en producción
        run: node tools/consola-produccion.mjs
