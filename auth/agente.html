<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>admira.biz · Entrada de agentes</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05080d;color:#e8eef6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.box{width:100%;max-width:430px;padding:32px 26px;border:1px solid #2f6fb0;border-radius:16px;background:#0b121c}
.mark{color:#6fb4ff;font:700 12px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}
h1{margin:14px 0 8px;font-size:22px}p{margin:0 0 18px;color:#9fb0c4;line-height:1.5;font-size:14px}a{color:#6fb4ff}
label{display:block;margin:0 0 6px;font:600 12px ui-monospace,monospace;color:#9fb0c4}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff2a;background:#0008;color:#fff;font-size:14px;margin-bottom:14px}
button{width:100%;padding:11px;border-radius:8px;border:1px solid #6fb4ff;background:transparent;color:#6fb4ff;font:700 13px ui-monospace,monospace;cursor:pointer}
.msg{margin-top:14px;font:600 13px ui-monospace,monospace;min-height:1em}.msg.err{color:#ff8f7a}.msg.ok{color:#7be0a5}
</style>
</head>
<body>
<main class="box">
  <div class="mark">admira.biz · perímetro de seguridad</div>
  <h1>Entrada de agentes</h1>
  <p>Para los agentes de silicio de AdmiraNeXT, sin Google. El token está en la bóveda (ADMIRA_AGENT_LOGIN_TOKEN) y cada entrada queda registrada. Las personas entran con Google en el <a href="/backoffice.html">backoffice</a>.</p>
  <form id="f" autocomplete="off">
    <label for="agente">Agente y máquina</label><input id="agente" name="agente" maxlength="80" placeholder="NeoMBP14">
    <label for="token">Token</label><input id="token" name="token" type="password" required>
    <button>Entrar</button>
  </form>
  <div id="msg" class="msg" role="status"></div>
</main>
<script>
// Encargo #5055. El POST lo reenvía _worker.js al API de la casa (api.admira.biz en admira.biz),
// que comprueba el token y deja la cookie de sesión; el token nunca va en la URL.
(function () {
  var q = new URLSearchParams(location.search), back = q.get('return_to') || '/backoffice.html';
  if (!/^\/(?!\/)/.test(back)) back = '/backoffice.html';
  var msg = document.getElementById('msg');
  if (/(^|\.)clearchannel\.tv$/i.test(location.hostname)) msg.textContent = 'La entrada de agentes está en admira.biz.';
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault(); msg.className = 'msg'; msg.textContent = 'Comprobando…';
    try {
      var r = await fetch('/auth/agente', { method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: { Authorization: 'Bearer ' + document.getElementById('token').value, 'X-Agente': document.getElementById('agente').value || 'agente' } });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
      document.getElementById('token').value = '';
      msg.className = 'msg ok'; msg.textContent = 'Dentro como ' + (d.name || 'agente') + '. Abriendo ' + back + '…';
      setTimeout(function () { location.assign(back); }, 600);
    } catch (err) { msg.className = 'msg err'; msg.textContent = 'Token no válido o entrada no disponible (' + err.message + ').'; }
  });
})();
</script>
</body>
</html>
